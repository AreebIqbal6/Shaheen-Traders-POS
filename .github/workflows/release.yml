name: Release
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Sync version from Git tag
        shell: pwsh
        run: |
          # Extract version from tag (e.g. v5.30 -> 0.5.30, v0.5.30 -> 0.5.30)
          $tag = "${{ github.ref_name }}"
          $ver = $tag -replace '^v',''
          # If tag is like "5.30" (no leading 0.), prefix with "0."
          if ($ver -match '^\d+\.\d+$' -and -not ($ver -match '^\d+\.\d+\.\d+')) {
            $ver = "0.$ver"
          }
          Write-Host "Syncing version to: $ver"

          # Update package.json
          $pkg = Get-Content package.json -Raw | ConvertFrom-Json
          $pkg.version = $ver
          $pkg | ConvertTo-Json -Depth 10 | Set-Content package.json -Encoding UTF8
          Write-Host "Updated package.json -> $ver"

          # Update tauri.conf.json
          $tauri = Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json
          $tauri.version = $ver
          $tauri | ConvertTo-Json -Depth 10 | Set-Content src-tauri/tauri.conf.json -Encoding UTF8
          Write-Host "Updated tauri.conf.json -> $ver"

          # Update Cargo.toml
          (Get-Content src-tauri/Cargo.toml -Raw) -replace 'version\s*=\s*"[^"]*"', "version = `"$ver`"" | Set-Content src-tauri/Cargo.toml -Encoding UTF8
          Write-Host "Updated Cargo.toml -> $ver"

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        
      - name: Sync Cargo.lock
        run: |
          cd src-tauri
          cargo update -p shaheen-pos

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Build and Release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ""
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: "ShaheenSecureKey2026!"
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'Shaheen POS ${{ github.ref_name }}'
          releaseBody: 'See the assets to download and install.'
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
